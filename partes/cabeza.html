<!-- script bloqueante: clase «js», entrar siempre arriba (checklist punto 12), «sin-webgl» y el mando de maqueta. -->
<script>
(function (d) {
  var h = d.documentElement;
  h.classList.add('js');
  window.Juanin = window.Juanin || {};
  // al recargar, Chrome devolvía la página a media altura: se entra siempre arriba, salvo con un #ancla
  try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
  if (!location.hash) window.scrollTo(0, 0);
  try { if (/[?&]sin-webgl\b/.test(location.search)) h.classList.add('sin-webgl'); } catch (e) {}
  // MANDO DE MAQUETA (no viaja al cliente): solo con ?revision
  try {
    var q = new URLSearchParams(location.search);
    if (q.has('revision')) {
      h.classList.add('revision');
      if (q.get('densidad') === 'sobria') h.classList.add('densidad-sobria');
    }
  } catch (e) {}
})(document);
</script>
